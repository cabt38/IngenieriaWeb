<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de cliente</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header>
        <h1>Restaurante</h1>
        <p class="subtitulo">Restaurante de comida tipica</p>
    </header>
    <nav>
        <a href="/">Inicio</a>
        <a href="/acerca">Acerca</a>
        <a href="/registro">Registro</a>
        <a href="/servicios">Servicios</a>
    </nav>

    <main>
        <section>
            <h2>Registro de cliente</h2>
            <p>
                Al registrarte podras ir a la seccion <strong>servicios</strong> y reservar una mesa
            </p>

            <form id="formulario-registro" action="/clientes" method="POST">
                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="ej. Cristian Barrientos"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ej. cliente@correo.com"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono</label>
                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        maxlength="10"
                        placeholder="ej. 3001234567"
                        required
                    >
                </div>

                <button type="submit">Registrarme</button>
            </form>
        </section>
    </main>

    <footer>
        <p>· Práctica de Ingeniería Web</p>
    </footer>
</body>
</html>
